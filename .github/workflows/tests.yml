name: Tests
on:
  push:
    branches: ['**']   # not tags: the release workflow tests each build itself
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    name: Python ${{ matrix.python }} · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[plot]"
      - run: python -m unittest discover -s tests -v
        env:
          MPLBACKEND: Agg

  docs-and-examples:
    name: API docs are current and examples run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install ".[plot]"
      - run: python tools/build_api_docs.py --check
      - name: Run the Python examples
        env:
          MPLBACKEND: Agg
        run: |
          mkdir -p example-output && cd example-output
          for script in ../examples/python/*.py; do echo "::group::$script"; python "$script"; echo "::endgroup::"; done

  matlab:
    name: MATLAB self-test and examples
    # MathWorks provides MATLAB on GitHub-hosted runners for public repositories.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024b
      - uses: matlab-actions/run-command@v2
        with:
          command: >-
            addpath('matlab'); mnbs_selftest;
            run('examples/matlab/example_01_quickstart.m');
            run('examples/matlab/example_02_layerwise.m');
            run('examples/matlab/example_03_your_own_data.m');
            run('examples/matlab/example_04_paired_and_glm.m');
